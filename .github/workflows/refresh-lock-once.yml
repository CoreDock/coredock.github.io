name: Refresh dependency lock once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-lock-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh vulnerable transitive dependencies in lockfile
        run: npm audit fix --package-lock-only

      - name: Verify audit is clean at high severity
        run: npm audit --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already clean; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: refresh landing dependency lock"
          git push
